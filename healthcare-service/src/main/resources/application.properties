spring.application.name=healthcare-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db
spring.datasource.username=postgres
spring.datasource.password=0000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Public Health Service connection
public-health.base-url=${PUBLIC_HEALTH_BASE_URL:http://localhost:8082}
public-health.api-key=${PUBLIC_HEALTH_API_KEY:change-this-local-key}
