<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}"
      xmlns:th="http://www.thymeleaf.org">
<head><title>Sign in</title></head>
<body>
<section class="login-panel">
    <span class="brand-mark" aria-hidden="true">+</span>
    <span class="eyebrow">RuralCare staff portal</span>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to coordinate care, medicine supplies and community health services.</p>

    <div class="alert alert--error" th:if="${param.error}">That username or password didn’t match. Please try again.</div>
    <div class="alert" th:if="${param.logout}">You’ve been signed out.</div>

    <form th:action="@{/login}" method="post" class="form">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Sign in</button>
    </form>
</section>
</body>
</html>
