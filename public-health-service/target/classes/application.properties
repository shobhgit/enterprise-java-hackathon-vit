
spring.application.name=public-health-service

# Server configuration
server.port=8082

# PostgreSQL database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/public_health_db}
spring.datasource.username=ruralhealth
spring.datasource.password=0000

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# API key authentication
publichealth.api-key=${PUBLIC_HEALTH_API_KEY:change-this-local-key}
